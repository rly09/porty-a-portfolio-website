name: Daily AI Blog Generation

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily blog post
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python scripts/generate_daily_blog.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain data/posts)" ]; then
            git add data/posts
            
            # Extract title of the newly generated post for the commit message
            BLOG_TITLE=$(python3 -c "import json, glob, os; files = sorted(glob.glob('data/posts/*.json'), key=os.path.getmtime); print(json.load(open(files[-1]))['title']) if files else print('new post')")
            
            git commit -m "content: add daily blog - ${BLOG_TITLE}"
            git push
            echo "Successfully committed and pushed daily blog post."
          else
            echo "No new blog generated today (or blog for today already exists). Skipping git commit."
          fi

      - name: Trigger Vercel redeploy
        if: success()
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Triggered Vercel redeploy successfully."
          else
            echo "VERCEL_DEPLOY_HOOK_URL secret not set — skipping redeploy trigger."
          fi
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
